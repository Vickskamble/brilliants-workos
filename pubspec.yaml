name: brilliants_workos
description: "Brilliants Work OS — Team Task + Performance + Target Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.8.4

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  freezed_annotation: ^3.1.0

  # Config
  flutter_dotenv: ^6.0.1

  # Local Storage
  flutter_secure_storage: ^10.3.1
  sembast: ^3.8.7
  sembast_web: ^2.4.4+1

  # UI
  fl_chart: ^0.70.2
  google_fonts: ^8.1.0

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1

  # Notifications
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  build_runner: ^2.4.15
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/env
